# ============================================================================
# Datenplattform-Vergleich fuer den Hostinger Docker-Manager.
#
# Zieht ein fertiges Image aus der GitHub Container Registry und baut nichts.
#
# Kein networks-Block: Das Traefik-Projekt auf diesem VPS laeuft mit
# network_mode: host und haengt in keinem Docker-Netz. Es findet die Container
# ueber den Docker-Socket und erreicht sie vom Host aus ueber ihre Container-IP.
# Ein externes Netz zu deklarieren wuerde hier fehlschlagen
# ("Docker project not found").
#
# Voraussetzungen:
#   - A-Record von dp.heyde.weise.uk auf die IP des VPS
#   - Das Paket ghcr.io/aaronheyde/aw-datenplattformen-heyde ist oeffentlich
# ============================================================================

services:
  app:
    image: ghcr.io/aaronheyde/aw-datenplattformen-heyde:latest
    container_name: heyde-datenplattformen
    restart: unless-stopped
    pull_policy: always

    environment:
      NODE_ENV: production
      PORT: "3001"
      # Im Container zwingend 0.0.0.0. Mit 127.0.0.1 laeuft der Container,
      # aber Traefik erreicht ihn nicht und liefert Bad Gateway.
      HOST: 0.0.0.0

    labels:
      - traefik.enable=true
      - traefik.http.routers.heyde-datenplattformen.rule=Host(`dp.heyde.weise.uk`)
      - traefik.http.routers.heyde-datenplattformen.entrypoints=websecure
      - traefik.http.routers.heyde-datenplattformen.tls=true
      - traefik.http.routers.heyde-datenplattformen.tls.certresolver=letsencrypt
      # Port im Container. Es wird bewusst kein Port auf dem Host veroeffentlicht.
      - traefik.http.services.heyde-datenplattformen.loadbalancer.server.port=3001

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
