name: Image bauen und veroeffentlichen

# Baut das Container-Image und legt es in der GitHub Container Registry ab.
# Damit braucht der Server nichts zu bauen — er zieht nur noch ein fertiges Image.
# Laeuft bei jedem Push auf main, bei jedem Versions-Tag und auf Knopfdruck.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write          # noetig, um in die Registry zu schreiben

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Wird von GitHub automatisch bereitgestellt — kein eigenes Secret noetig.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Metadaten bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Der Cache spart bei Folgelaeufen den npm-ci-Schritt.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ergebnis anzeigen
        run: |
          echo "Veroeffentlichte Tags:"
          echo "${{ steps.meta.outputs.tags }}"
