# ============================================================================
# Traefik fuer den Hostinger Docker-Manager — Fassung mit festen Werten,
# zum direkten Einfuegen ins Panel.
#
# NUR anlegen, wenn im Docker-Manager noch KEIN Traefik-Projekt laeuft.
# Zwei Traefik-Instanzen streiten sich um die Ports 80 und 443; die zweite
# scheitert mit "address already in use".
#
# EINE STELLE ANPASSEN: die E-Mail-Adresse fuer Let's Encrypt.
# ============================================================================

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped

    command:
      # Nur Container mit traefik.enable=true werden geroutet.
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Alles auf HTTPS umleiten.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # ANPASSEN: eigene Adresse. Dorthin gehen Ablaufwarnungen.
      - --certificatesresolvers.letsencrypt.acme.email=aaron.weise@heyde.ch
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --log.level=INFO
      - --accesslog=true

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Nur lesend: Traefik muss die Container sehen, nicht steuern.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/letsencrypt

    networks:
      - traefik-proxy

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  acme:

networks:
  traefik-proxy:
    name: traefik-proxy
