# nginx-Reverse-Proxy fuer heyde-datenplattformen
#
# ANPASSEN: der Platzhalter dp.heyde.famweise.ch ist durch die tatsaechliche Domain
# zu ersetzen, an vier Stellen: zweimal server_name, zweimal Zertifikatspfad.
# Die TLS-Zeilen setzt certbot beim ersten Lauf selbst ein; siehe README.
#
# Ablage: /etc/nginx/sites-available/heyde-datenplattformen
# Aktivieren: ln -s ../sites-available/heyde-datenplattformen /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name dp.heyde.famweise.ch;   # ANPASSEN

    # certbot legt hier seine Challenge ab; alles andere geht auf HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dp.heyde.famweise.ch;   # ANPASSEN

    # Von certbot verwaltet — nach dem ersten certbot-Lauf vorhanden.
    ssl_certificate     /etc/letsencrypt/live/dp.heyde.famweise.ch/fullchain.pem;   # ANPASSEN
    ssl_certificate_key /etc/letsencrypt/live/dp.heyde.famweise.ch/privkey.pem;     # ANPASSEN
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Die Seite laedt DM Sans und Inter von Google Fonts. Wird die Schrift lokal
    # gehostet (siehe README, Abschnitt Stolpersteine), koennen fonts.googleapis.com
    # und fonts.gstatic.com aus der Richtlinie entfernt werden.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    access_log /var/log/nginx/heyde-datenplattformen.access.log;
    error_log  /var/log/nginx/heyde-datenplattformen.error.log;

    location = /healthz {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }
}
