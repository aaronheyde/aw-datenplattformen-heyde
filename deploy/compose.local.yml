# Eigenstaendige Compose-Datei zum lokalen Testen ohne Traefik.
# Kein Overlay, keine Traefik-Labels, kein externes Netz noetig.
#
#   docker compose -f deploy/compose.local.yml up -d --build
#   curl -s http://127.0.0.1:3001/healthz
#   docker compose -f deploy/compose.local.yml down

name: heyde-datenplattformen-local

services:
  app:
    build:
      context: ..
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    image: heyde-datenplattformen:${APP_VERSION:-1.0.0}
    container_name: heyde-datenplattformen-local
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: 0.0.0.0

    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3001}:3001"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
